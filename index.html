<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>普通話練習大本營</title>
    <style>
        :root {
            --primary-color: #ff85a2;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #d66d85;
            --shadow: 8px 8px 18px #f0e6e8, -8px -8px 18px #ffffff;
            --inner-shadow: inset 4px 4px 8px #f0e6e8, inset -4px -4px 8px #ffffff;
            --font-main: "Yuanti SC", "YouYuan", "STYuanti-SC-Regular", "微軟正黑體", "Microsoft JhengHei", sans-serif;
            --accent-color: #ff4757; 
            /* 新增紫色調用於四聲專案 */
            --tone3-color: #9b59b6;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: #444; min-height: 100vh;
        }

        .fixed-header-title {
            position: fixed; top: 15px; right: 20px;
            font-size: 14px; color: var(--text-color);
            z-index: 1000; font-weight: bold;
            background: rgba(255, 245, 247, 0.9);
            padding: 5px 12px; border-radius: 20px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .container { max-width: 900px; margin: 0 auto; padding: 70px 25px 50px; }

        .welcome-section { text-align: center; margin-bottom: 50px; }
        .welcome-section h1 {
            color: var(--primary-color); font-size: 34px;
            margin-bottom: 12px; letter-spacing: 1px;
        }
        .welcome-section p { color: #b5838d; font-size: 16px; margin: 0; }

        .section-title {
            font-size: 20px; color: var(--text-color);
            margin: 40px 0 20px; display: flex;
            align-items: center; gap: 12px; font-weight: bold;
        }

        .section-title::before {
            content: ""; display: inline-block;
            width: 6px; height: 22px;
            background: var(--primary-color); border-radius: 10px;
        }

        .special-section::before { background: #ffbc42; }
        .special-title { color: #e67e22; }

        /* 新增四聲專題標題樣式 */
        .tone3-section::before { background: var(--tone3-color); }
        .tone3-title { color: var(--tone3-color); }

        .game-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;
        }

        .game-card {
            background: var(--card-bg); border-radius: 30px;
            padding: 30px 20px; text-align: center;
            text-decoration: none; color: inherit;
            box-shadow: var(--shadow); border: 2.5px solid white;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
        }

        .game-card:active { transform: scale(0.96); box-shadow: var(--inner-shadow); }

        .game-icon { font-size: 45px; margin-bottom: 15px; }
        .game-name { font-weight: bold; font-size: 16px; color: #444; margin-bottom: 12px; }

        .game-status {
            font-size: 11px; padding: 4px 12px; border-radius: 12px;
            background: #fff0f3; color: var(--primary-color); font-weight: bold;
        }

        .status-new { background: var(--accent-color) !important; color: white !important; }

        .game-card.locked { opacity: 0.7; cursor: default; box-shadow: none; background: rgba(255,255,255,0.5); }
        .game-card.locked .game-status { background: #e0e0e0; color: #888; }

        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .game-card { padding: 25px 10px; }
        }

        .copyright {
            margin-top: 60px; font-size: 12px; color: #b5838d;
            text-align: center; line-height: 1.8; padding-bottom: 40px;
        }
    </style>
</head>
<body>

<div class="fixed-header-title">普通話練習大本營</div>

<div class="container">
    <div class="welcome-section">
     <h1>普通話練習大本營</h1>
        <p>探索普通話聲、韻、調的奧秘，讓發音更標準！</p>
    </div>

    <div class="section-title tone3-section"><span class="tone3-title">四聲專項練習</span></div>
    <div class="game-grid" id="grid-tone3-series"></div>

    <div class="section-title special-section"><span class="special-title">「一」、「不」的變調專題系列</span></div>
    <div class="game-grid" id="grid-yi-series"></div>

    <div class="section-title">輕聲詞語翻卡系列</div>
    <div class="game-grid" id="grid-qingsheng-flip"></div>

    <div class="section-title">趣味挑戰系列</div>
    <div class="game-grid" id="grid-challenges"></div>

    <div class="copyright">
        網頁僅供內部使用。<br>
       普通話培訓測試中心 版權所有。
    </div>
</div>

<script>
    // 1. 四聲專項練習數據
    const tone3Games = [
        { name: "第三聲發音練習 1", url: "https://echo02-game.github.io/psctone32-02/", icon: "🔔", status: "NEW" },
        { name: "一四聲發音練習 2", url: "https://echo02-game.github.io/psctone14-02/", icon: "🔉", status: "NEW" }
    ];

    // 2. 「一」、「不」的變調專題數據
    const yiGames = [
        { name: "一的變調翻卡練習", url: "https://yangjingjing2019-lang.github.io/yitone/", icon: "🔢", status: "NEW" },
        { name: "一的變調測驗挑戰", url: "https://yangjingjing2019-lang.github.io/yitonetest/", icon: "✍️", status: "NEW" },
        { name: "不的變調練習", url: "https://yangjingjing2019-lang.github.io/butonetest/", icon: "📚", status: "NEW" },
        { name: "不的變調練習 2", url: "#", icon: "📒", status: "敬請期待" }
    ];

    // 3. 輕聲詞語翻卡數據
    const flipGames = [
        { name: "輕聲詞語翻卡練習 1", url: "https://yangjingjing2019-lang.github.io/pinyin-memory-game/", icon: "🌸", status: "已上線" },
        { name: "輕聲詞語翻卡練習 2", url: "https://yangjingjing2019-lang.github.io/qingshengci2/", icon: "🃏", status: "已上線" },
        { name: "輕聲詞語翻卡練習 3", url: "https://yangjingjing2019-lang.github.io/qingshengci3/", icon: "💎", status: "已上線" },
        { name: "輕聲詞語翻卡練習 4", url: "https://yangjingjing2019-lang.github.io/qingshengci4/", icon: "🌟", status: "已上線" },
        { name: "輕聲詞語翻卡練習 5", url: "https://yangjingjing2019-lang.github.io/qingshengci5/", icon: "🎈", status: "已上線" }, 
        { name: "輕聲詞語翻卡練習 6", url: "https://yangjingjing2019-lang.github.io/qingshengci6/", icon: "🍀", status: "已上線" }, 
    ];

    // 4. 趣味挑戰數據
    const challengeGames = [
        { name: "趣味挑戰 1", url: "https://yangjingjing2019-lang.github.io/qingshengcigame1/", icon: "🚀", status: "已上線" },
        { name: "名量詞挑戰 ", url: "https://yangjingjing2019-lang.github.io/measurewords1/", icon: "🎯", status: "已上線" },
        { name: "趣味挑戰 3", url: "#", icon: "🧩", status: "敬請期待" }, 
        { name: "趣味挑戰 4", url: "#", icon: "👾", status: "敬請期待" }  
    ];
    // 核心優化：使用 DOMContentLoaded 替換 window.onload，大幅提升加載感官速度
    document.addEventListener('DOMContentLoaded', () => {
        renderGames('grid-yi-series', yiGames);
        renderGames('grid-tone3-series', tone3Games); 
        renderGames('grid-qingsheng-flip', flipGames);
        renderGames('grid-challenges', challengeGames);
    });

    function renderGames(containerId, games) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = games.map(game => {
            const isLocked = game.status === '敬請期待';
            const isNew = game.status === 'NEW';
            return `
<a href="${game.url !== '#' ? game.url : 'javascript:void(0)'}" class="game-card ${isLocked ? 'locked' : ''}" ${game.url !== '#' ? `target="_self"` : 'onclick="alert(\'即將推出，敬請期待！\')"'}>
                   class="game-card ${isLocked ? 'locked' : ''}"
                   ${game.url !== '#' ? `target="_self"` : 'onclick="alert(\'即將推出，敬請期待！\')"'}>
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-name">${game.name}</div>
                    <div class="game-status ${isNew ? 'status-new' : ''}">${game.status}</div>
                </a>
            `;
        }).join('');
    }
</script>

</html>
